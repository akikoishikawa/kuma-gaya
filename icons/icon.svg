<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- くまガヤのアイコン（ツキノワグマ）。icon-180.png / icon-512.png はこれから書き出す -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#f6a35a"/>
      <stop offset="1" stop-color="#d9692a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 体（肩から下）と胸の月の輪 -->
  <path d="M60 512 C70 410 150 352 256 352 C362 352 442 410 452 512 Z" fill="#141414"/>
  <path d="M146 414 C196 450 316 450 366 414 C334 500 178 500 146 414 Z" fill="#fbf6ee"/>

  <!-- 耳 -->
  <circle cx="142" cy="122" r="58" fill="#141414"/>
  <circle cx="370" cy="122" r="58" fill="#141414"/>
  <circle cx="142" cy="122" r="30" fill="#3a3a3a"/>
  <circle cx="370" cy="122" r="30" fill="#3a3a3a"/>

  <!-- 顔 -->
  <ellipse cx="256" cy="232" rx="158" ry="146" fill="#141414"/>

  <!-- 目（黒い顔に溶けないよう白いふちと光） -->
  <circle cx="196" cy="214" r="21" fill="#fbf6ee"/>
  <circle cx="316" cy="214" r="21" fill="#fbf6ee"/>
  <circle cx="199" cy="218" r="13" fill="#141414"/>
  <circle cx="313" cy="218" r="13" fill="#141414"/>
  <circle cx="204" cy="212" r="4.5" fill="#fff"/>
  <circle cx="318" cy="212" r="4.5" fill="#fff"/>

  <!-- 鼻まわりと鼻 -->
  <ellipse cx="256" cy="290" rx="62" ry="46" fill="#2c2c2c"/>
  <ellipse cx="256" cy="274" rx="27" ry="18" fill="#000"/>
  <ellipse cx="248" cy="268" rx="8" ry="4.5" fill="#fff" fill-opacity=".6"/>
  <path d="M256 292 V306 M256 306 C246 318 232 318 226 310 M256 306 C266 318 280 318 286 310" stroke="#000" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
