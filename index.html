<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="くまガヤ">
  <meta name="theme-color" content="#000000">
  <title>くまガヤ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>
  <pre id="status" hidden></pre>
  <div id="error" role="alert" hidden></div>

  <section id="start">
    <img class="logo" src="icons/icon-512.png" alt="" width="160" height="160">
    <h1>くまガヤ</h1>
    <button id="start-btn" type="button">スタート</button>
    <p id="start-msg" aria-live="polite"></p>
    <p class="hint">左上の隅を3回タップで設定</p>
  </section>

  <div id="panel" hidden></div>
</body>
</html>
